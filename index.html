<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>CD GAM — Acompanhamento de Produtividade</title>
<style>
  html,body{height:100%;margin:0;background:#061625;color:#d7ecff;font-family:Arial,Helvetica,sans-serif}
  .boot{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:520px;border:1px solid #17476d;background:#0c2136;padding:22px;border-radius:8px;box-shadow:0 16px 45px rgba(0,0,0,.35)}
  .brand{font-weight:900;color:#ffd700;letter-spacing:.02em;margin-bottom:10px}
  .msg{color:#8fd0ff;font-size:15px;line-height:1.4}
  .err{color:#ff6b7c;margin-top:12px;font-weight:700}
  button{margin-top:16px;background:#0d8cff;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="boot"><div class="box"><div class="brand">CD GAM</div><div class="msg">Carregando versao atualizada...</div><div id="err" class="err"></div></div></div>
<script>
(async function(){
  const endpoint='https://gam-sjp-default-rtdb.firebaseio.com/cdgam/appHtml.json?t='+Date.now();
  try{
    const res=await fetch(endpoint,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const payload=await res.json();
    const html=payload&&payload.html;
    if(!html||typeof html!=='string')throw new Error('versao nao encontrada');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('err').innerHTML='Nao foi possivel carregar a versao atualizada. <br><button onclick="location.reload()">Tentar novamente</button>';
    console.error('Falha ao carregar CD GAM:',err);
  }
})();
</script>
</body>
</html>
